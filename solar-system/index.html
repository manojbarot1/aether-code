<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Solar System Simulator Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#030712;--panel:#0d1b2a;--panel2:#0a1628;--border:#1e3a5f;
  --accent:#3b82f6;--accent2:#60a5fa;--text:#e2e8f0;--muted:#64748b;
  --sun:#fbbf24;--mercury:#94a3b8;--venus:#d97706;--earth:#2563eb;
  --mars:#dc2626;--jupiter:#92400e;--saturn:#ca8a04;--uranus:#0891b2;--neptune:#1d4ed8;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;}
/* LAYOUT */
#app{display:grid;grid-template-rows:48px 1fr 110px;grid-template-columns:220px 1fr 260px;height:100vh;gap:0;}
#topbar{grid-column:1/-1;grid-row:1;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;z-index:10;}
#left-panel{grid-column:1;grid-row:2;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:8px;}
#canvas-area{grid-column:2;grid-row:2;position:relative;overflow:hidden;cursor:grab;}
#canvas-area.grabbing{cursor:grabbing;}
#right-panel{grid-column:3;grid-row:2;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:10px 8px;}
#timeline{grid-column:1/-1;grid-row:3;background:var(--panel2);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;overflow:hidden;}
canvas{display:block;width:100%;height:100%;}
/* TOP BAR */
.logo{font-size:16px;font-weight:700;color:var(--accent2);letter-spacing:.5px;display:flex;align-items:center;gap:8px;}
.logo span{font-size:20px;}
.status-badge{background:#0f2744;border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px;color:var(--muted);}
.status-badge.running{border-color:#16a34a;color:#4ade80;}
.status-badge.paused{border-color:#ca8a04;color:#fbbf24;}
#sim-date-display{font-size:12px;color:var(--accent2);margin-left:auto;font-variant-numeric:tabular-nums;}
/* PANELS */
.section-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:6px 4px 4px;}
.ctrl-row{display:flex;align-items:center;gap:6px;padding:3px 4px;}
.ctrl-row label{flex:1;color:var(--text);font-size:12px;}
button.btn{background:#1e3a5f;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px;transition:background .15s;}
button.btn:hover{background:#2563eb;}
button.btn.active{background:#1d4ed8;border-color:var(--accent);}
button.btn.danger{background:#7f1d1d;border-color:#dc2626;}
button.btn.danger:hover{background:#dc2626;}
.btn-group{display:flex;gap:4px;flex-wrap:wrap;padding:3px 4px;}
.speed-btn{background:#0d1b2a;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:3px 6px;cursor:pointer;font-size:11px;transition:all .15s;}
.speed-btn:hover{color:var(--text);border-color:var(--accent);}
.speed-btn.active{background:#1e3a5f;color:var(--accent2);border-color:var(--accent);}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:#1e3a5f;border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;}
select{background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:4px 6px;font-size:12px;width:100%;cursor:pointer;}
.toggle-row{display:flex;align-items:center;gap:8px;padding:3px 4px;}
.toggle-row label{flex:1;font-size:12px;}
.toggle{position:relative;width:34px;height:18px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.slider-t{position:absolute;inset:0;background:#1e3a5f;border-radius:18px;cursor:pointer;transition:.2s;}
.slider-t:before{content:'';position:absolute;width:12px;height:12px;left:3px;top:3px;background:#64748b;border-radius:50%;transition:.2s;}
input:checked+.slider-t{background:#1d4ed8;}
input:checked+.slider-t:before{transform:translateX(16px);background:#fff;}
/* PLANET SELECTOR LIST */
.planet-list{display:flex;flex-direction:column;gap:2px;}
.planet-item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.planet-item:hover{background:#0d1b2a;}
.planet-item.selected{background:#0f2744;border-color:var(--accent);}
.planet-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
/* RIGHT PANEL */
.info-header{padding:8px 4px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.info-header h2{font-size:16px;font-weight:700;}
.info-header .type-badge{font-size:10px;color:var(--muted);margin-top:2px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;padding:4px;}
.info-cell{background:#030712;border-radius:4px;padding:6px 8px;}
.info-cell .label{font-size:10px;color:var(--muted);text-transform:uppercase;}
.info-cell .value{font-size:12px;font-weight:600;color:var(--accent2);margin-top:2px;}
.info-facts{padding:6px 4px;}
.info-facts h4{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.fact-item{font-size:11px;color:var(--text);margin-bottom:4px;padding-left:10px;position:relative;line-height:1.4;}
.fact-item:before{content:'▸';position:absolute;left:0;color:var(--accent);}
.atmo{font-size:11px;color:var(--muted);padding:4px 4px 0;line-height:1.5;}
/* TIMELINE */
.tl-label{font-size:11px;color:var(--muted);white-space:nowrap;}
.tl-presets{display:flex;gap:4px;flex-wrap:nowrap;}
.tl-preset{background:#0d1b2a;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px;white-space:nowrap;transition:all .15s;}
.tl-preset:hover{color:var(--text);border-color:var(--accent);}
.tl-sep{width:1px;height:30px;background:var(--border);flex-shrink:0;}
#date-input{background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:4px 8px;font-size:12px;}
.tl-dir{display:flex;gap:4px;align-items:center;}
.tl-dir button{background:#1e3a5f;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 10px;cursor:pointer;font-size:16px;line-height:1;}
.tl-dir button:hover{background:#2563eb;}
#time-direction{font-size:11px;padding:3px 6px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;}
/* TOOLTIP */
#tooltip{position:fixed;background:#0d1b2a;border:1px solid var(--accent);border-radius:5px;padding:4px 10px;font-size:11px;color:var(--text);pointer-events:none;display:none;z-index:100;}
/* SCROLLBAR */
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="logo"><span>🪐</span> Solar System Simulator</div>
    <div class="status-badge running" id="status-badge">● RUNNING</div>
    <div class="status-badge" id="speed-badge">1×</div>
    <div id="sim-date-display">Simulated: <span id="sim-date-text">Jan 1, 2024</span></div>
  </div>

  <!-- LEFT PANEL -->
  <div id="left-panel">
    <div class="section-title">Simulation Controls</div>
    <div class="btn-group">
      <button class="btn active" id="btn-playpause">⏸ Pause</button>
      <button class="btn" id="btn-reset">↺ Reset</button>
    </div>

    <div class="section-title">Speed</div>
    <div class="btn-group" id="speed-btns">
      <button class="speed-btn" data-speed="0.25">¼×</button>
      <button class="speed-btn" data-speed="0.5">½×</button>
      <button class="speed-btn active" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="2">2×</button>
      <button class="speed-btn" data-speed="5">5×</button>
      <button class="speed-btn" data-speed="10">10×</button>
      <button class="speed-btn" data-speed="50">50×</button>
      <button class="speed-btn" data-speed="100">100×</button>
    </div>

    <div class="section-title">Display Options</div>
    <div class="toggle-row"><label>Orbit Paths</label><label class="toggle"><input type="checkbox" id="tog-orbits" checked><span class="slider-t"></span></label></div>
    <div class="toggle-row"><label>Planet Labels</label><label class="toggle"><input type="checkbox" id="tog-labels" checked><span class="slider-t"></span></label></div>
    <div class="toggle-row"><label>Grid Lines</label><label class="toggle"><input type="checkbox" id="tog-grid" checked><span class="slider-t"></span></label></div>

    <div class="section-title">Scale Mode</div>
    <div class="btn-group">
      <button class="btn active" id="btn-edu" onclick="setScale('edu')">🎓 Educational</button>
      <button class="btn" id="btn-real" onclick="setScale('real')">📐 Real Scale</button>
    </div>

    <div class="section-title">Zoom</div>
    <div class="ctrl-row">
      <button class="btn" onclick="zoom(-0.2)">−</button>
      <input type="range" id="zoom-slider" min="0.1" max="5" step="0.05" value="1" oninput="setZoom(+this.value)">
      <button class="btn" onclick="zoom(0.2)">+</button>
    </div>

    <div class="section-title">Planets</div>
    <div class="planet-list" id="planet-list"></div>
    <div style="padding:4px 0;">
      <button class="btn" id="btn-focus" style="width:100%;" onclick="focusSelected()">🎯 Focus on Planet</button>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-area">
    <canvas id="sim-canvas"></canvas>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right-panel">
    <div class="info-header">
      <h2 id="info-name">Click a planet</h2>
      <div class="info-cell type-badge" id="info-type" style="display:none;"></div>
    </div>
    <div class="info-grid" id="info-grid"></div>
    <div class="atmo" id="info-atmo"></div>
    <div class="info-facts" id="info-facts-box"></div>
  </div>

  <!-- TIMELINE -->
  <div id="timeline">
    <div class="tl-label">📅 Date:</div>
    <input type="date" id="date-input" value="2024-01-01">
    <button class="btn" style="font-size:11px;padding:4px 8px;" onclick="applyDate()">Set</button>
    <div class="tl-sep"></div>
    <div class="tl-label">Jump:</div>
    <div class="tl-presets">
      <button class="tl-preset" onclick="jumpTime(0)">Today</button>
      <button class="tl-preset" onclick="jumpTime(30)">+1 Mo</button>
      <button class="tl-preset" onclick="jumpTime(365)">+1 Yr</button>
      <button class="tl-preset" onclick="jumpTime(3650)">+10 Yr</button>
      <button class="tl-preset" onclick="jumpTime(36500)">+100 Yr</button>
      <button class="tl-preset" onclick="jumpTime(-365)">−1 Yr</button>
    </div>
    <div class="tl-sep"></div>
    <div class="tl-dir">
      <span class="tl-label">Direction:</span>
      <select id="time-direction">
        <option value="1">Forward</option>
        <option value="-1">Backward</option>
      </select>
    </div>
    <div style="margin-left:auto;font-size:10px;color:var(--muted);">Simulated time ≠ real time</div>
  </div>
</div>
<div id="tooltip"></div>

<script>
'use strict';
// ─────────────────────────────────────────────
//  DATA
// ─────────────────────────────────────────────
const PLANETS = [
  {
    name:'Sun', type:'Star', color:'#fbbf24', glowColor:'rgba(251,191,36,0.3)',
    eduRadius:22, realRadius:695700, eduOrbit:0, realOrbit:0, period:0, rotPeriod:25.4,
    moons:0, diameter:'1,392,700 km', mass:'1.989×10³⁰ kg', distSun:'0', orbitalPeriod:'—',
    rotPeriodStr:'25.4 days', temp:'5,500°C (surface)', atmo:'H₂ 73%, He 25%, O, C, Ne, Fe',
    facts:['Contains 99.86% of Solar System mass','Core temp ~15 million °C','Light takes ~8 min to reach Earth','Diameter ~109× Earth']
  },
  {
    name:'Mercury', type:'Terrestrial Planet', color:'#94a3b8',
    eduRadius:4, realRadius:2439.7, eduOrbit:70, realOrbit:0.387,
    period:87.97, rotPeriod:58.6, moons:0,
    diameter:'4,879 km', mass:'3.301×10²³ kg', distSun:'57.9 M km', orbitalPeriod:'87.97 days',
    rotPeriodStr:'58.6 days', temp:'−180 to 430°C', atmo:'Virtually none (trace O, Na, H)',
    facts:['Closest planet to the Sun','No moons and no rings','Huge temperature swings','Shrinking slowly as core cools']
  },
  {
    name:'Venus', type:'Terrestrial Planet', color:'#d97706',
    eduRadius:7, realRadius:6051.8, eduOrbit:110, realOrbit:0.723,
    period:224.7, rotPeriod:-243, moons:0,
    diameter:'12,104 km', mass:'4.867×10²⁴ kg', distSun:'108.2 M km', orbitalPeriod:'224.7 days',
    rotPeriodStr:'243 days (retrograde)', temp:'465°C (avg)', atmo:'CO₂ 96.5%, N₂ 3.5%',
    facts:['Hottest planet despite not being closest','Rotates backwards','Day longer than its year','Crushing atmospheric pressure']
  },
  {
    name:'Earth', type:'Terrestrial Planet', color:'#2563eb', cloudColor:'rgba(255,255,255,0.15)',
    eduRadius:8, realRadius:6371, eduOrbit:155, realOrbit:1.0,
    period:365.25, rotPeriod:1, moons:1,
    diameter:'12,742 km', mass:'5.972×10²⁴ kg', distSun:'149.6 M km', orbitalPeriod:'365.25 days',
    rotPeriodStr:'24 hours', temp:'15°C (avg)', atmo:'N₂ 78%, O₂ 21%, Ar 0.93%, CO₂ 0.04%',
    facts:['Only known planet with life','Plate tectonics shape surface','Large Moon stabilizes axial tilt','Magnetic field shields from solar wind']
  },
  {
    name:'Mars', type:'Terrestrial Planet', color:'#dc2626',
    eduRadius:5, realRadius:3389.5, eduOrbit:205, realOrbit:1.524,
    period:686.97, rotPeriod:1.03, moons:2,
    diameter:'6,779 km', mass:'6.417×10²³ kg', distSun:'227.9 M km', orbitalPeriod:'686.97 days',
    rotPeriodStr:'24.6 hours', temp:'−65°C (avg)', atmo:'CO₂ 95%, N₂ 2.6%, Ar 1.9%',
    facts:['Home to Olympus Mons, largest volcano','Valles Marineris — largest canyon system','Has two small moons: Phobos & Deimos','Past evidence of liquid water']
  },
  {
    name:'Jupiter', type:'Gas Giant', color:'#92400e', bandColor:'#b45309',
    eduRadius:16, realRadius:69911, eduOrbit:280, realOrbit:5.203,
    period:4332.59, rotPeriod:0.414, moons:95,
    diameter:'139,820 km', mass:'1.898×10²⁷ kg', distSun:'778.5 M km', orbitalPeriod:'11.86 years',
    rotPeriodStr:'9.9 hours', temp:'−110°C (cloud tops)', atmo:'H₂ 89%, He 10%, CH₄, NH₃',
    facts:['Largest planet — 1,300 Earths fit inside','Great Red Spot storm > 350 years old','Fastest rotation in Solar System','Strong magnetic field, 95 known moons']
  },
  {
    name:'Saturn', type:'Gas Giant', color:'#ca8a04', ringColor:'rgba(202,138,4,0.35)',
    eduRadius:14, realRadius:58232, eduOrbit:360, realOrbit:9.537,
    period:10759.22, rotPeriod:0.444, moons:146,
    diameter:'116,460 km', mass:'5.683×10²⁶ kg', distSun:'1.43 B km', orbitalPeriod:'29.46 years',
    rotPeriodStr:'10.7 hours', temp:'−140°C (cloud tops)', atmo:'H₂ 96%, He 3%, CH₄, NH₃',
    facts:['Iconic ring system of ice & rock','Least dense planet (would float on water)','Titan has lakes of liquid methane','146 known moons']
  },
  {
    name:'Uranus', type:'Ice Giant', color:'#0891b2',
    eduRadius:11, realRadius:25362, eduOrbit:430, realOrbit:19.191,
    period:30688.5, rotPeriod:-0.718, moons:28,
    diameter:'50,724 km', mass:'8.681×10²⁵ kg', distSun:'2.87 B km', orbitalPeriod:'84.01 years',
    rotPeriodStr:'17.2 hours (retrograde)', temp:'−195°C (avg)', atmo:'H₂ 83%, He 15%, CH₄ 2.3%',
    facts:['Tilted 98° — orbits on its side','Methane gives blue-green color','Has 13 rings','Coldest planetary atmosphere (−224°C min)']
  },
  {
    name:'Neptune', type:'Ice Giant', color:'#1d4ed8',
    eduRadius:10, realRadius:24622, eduOrbit:490, realOrbit:30.069,
    period:60190, rotPeriod:0.671, moons:16,
    diameter:'49,244 km', mass:'1.024×10²⁶ kg', distSun:'4.50 B km', orbitalPeriod:'164.8 years',
    rotPeriodStr:'16.1 hours', temp:'−200°C (avg)', atmo:'H₂ 80%, He 19%, CH₄ 1.5%',
    facts:['Fastest winds in Solar System (2,100 km/h)','Triton orbits backwards','Discovered by mathematics before observation','Farthest planet from Sun']
  }
];

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
const state = {
  running: true,
  speed: 1,
  direction: 1,
  scaleMode: 'edu',
  showOrbits: true,
  showLabels: true,
  showGrid: true,
  zoom: 1,
  panX: 0,
  panY: 0,
  selectedIndex: -1,
  angles: PLANETS.map(() => Math.random() * Math.PI * 2),
  selfAngles: PLANETS.map(() => 0),
  simDays: 0,          // days elapsed from startDate
  startDate: new Date('2024-01-01'),
  lastTime: null,
  DAYS_PER_SEC: 30     // at 1× speed, 30 sim-days per real second
};

// ─────────────────────────────────────────────
//  CANVAS + RESIZE
// ─────────────────────────────────────────────
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');
const area = document.getElementById('canvas-area');

function resize(){
  canvas.width = area.clientWidth;
  canvas.height = area.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ─────────────────────────────────────────────
//  PLANET LIST (left panel)
// ─────────────────────────────────────────────
const planetListEl = document.getElementById('planet-list');
PLANETS.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'planet-item';
  div.innerHTML = `<div class="planet-dot" style="background:${p.color};${i===0?'box-shadow:0 0 6px '+p.color:''}"></div><span>${p.name}</span>`;
  div.addEventListener('click', () => selectPlanet(i));
  planetListEl.appendChild(div);
});

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function orbitRadius(p, i){
  if(i===0) return 0;
  if(state.scaleMode==='edu') return p.eduOrbit * state.zoom;
  // Real scale: AU → pixels, 1AU = 120px at zoom=1
  return p.realOrbit * 120 * state.zoom;
}

function planetRadius(p, i){
  if(state.scaleMode==='edu') return Math.max(2, p.eduRadius * Math.sqrt(state.zoom));
  // Real scale relative to Sun
  const BASE=22;
  return Math.max(1.5, BASE*(p.realRadius/695700)*state.zoom*20);
}

function cx(){ return canvas.width/2 + state.panX; }
function cy(){ return canvas.height/2 + state.panY; }

// ─────────────────────────────────────────────
//  STAR BACKGROUND (static, drawn once to offscreen)
// ─────────────────────────────────────────────
let starBuf = null;
function buildStars(){
  starBuf = document.createElement('canvas');
  starBuf.width = 2000; starBuf.height = 1200;
  const sc = starBuf.getContext('2d');
  sc.fillStyle='#030712'; sc.fillRect(0,0,2000,1200);
  for(let i=0;i<700;i++){
    const x=Math.random()*2000, y=Math.random()*1200;
    const r=Math.random()*1.2+0.2;
    const a=Math.random()*0.7+0.3;
    sc.beginPath(); sc.arc(x,y,r,0,Math.PI*2);
    sc.fillStyle=`rgba(255,255,255,${a})`; sc.fill();
  }
}
buildStars();

// ─────────────────────────────────────────────
//  DRAW
// ─────────────────────────────────────────────
function draw(){
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  // stars
  if(starBuf) ctx.drawImage(starBuf, 0, 0, W, H);

  const ox=cx(), oy=cy();

  // grid
  if(state.showGrid){
    ctx.save();
    ctx.strokeStyle='rgba(30,58,95,0.5)'; ctx.lineWidth=0.5;
    const STEP=60*state.zoom;
    for(let x=ox%STEP;x<W;x+=STEP){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=oy%STEP;y<H;y+=STEP){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.restore();
  }

  // orbit paths
  if(state.showOrbits){
    PLANETS.forEach((p,i)=>{
      if(i===0) return;
      const r=orbitRadius(p,i);
      ctx.beginPath(); ctx.arc(ox,oy,r,0,Math.PI*2);
      ctx.strokeStyle = i===state.selectedIndex ? 'rgba(96,165,250,0.5)' : 'rgba(30,58,95,0.45)';
      ctx.lineWidth = i===state.selectedIndex ? 1.5 : 0.8;
      ctx.stroke();
    });
  }

  // planets + sun
  PLANETS.forEach((p,i)=>{
    const r = orbitRadius(p,i);
    const angle = state.angles[i];
    const px = i===0 ? ox : ox + r*Math.cos(angle);
    const py = i===0 ? oy : oy + r*Math.sin(angle);
    const pr = planetRadius(p,i);

    // Saturn rings
    if(p.name==='Saturn'){
      ctx.save();
      ctx.translate(px,py);
      ctx.rotate(angle+0.4);
      ctx.scale(1, 0.35);
      ctx.beginPath(); ctx.arc(0,0,pr*2.5,0,Math.PI*2);
      ctx.strokeStyle='rgba(202,138,4,0.5)'; ctx.lineWidth=pr*0.9; ctx.stroke();
      ctx.restore();
    }

    // glow for sun
    if(i===0){
      const grd=ctx.createRadialGradient(px,py,pr*0.5,px,py,pr*2.5);
      grd.addColorStop(0,'rgba(251,191,36,0.6)');
      grd.addColorStop(1,'rgba(251,191,36,0)');
      ctx.beginPath(); ctx.arc(px,py,pr*2.5,0,Math.PI*2);
      ctx.fillStyle=grd; ctx.fill();
    }

    // planet body
    const grad=ctx.createRadialGradient(px-pr*0.3,py-pr*0.3,pr*0.1,px,py,pr);
    grad.addColorStop(0, lighten(p.color,60));
    grad.addColorStop(1, p.color);
    ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2);
    ctx.fillStyle=grad; ctx.fill();

    // Jupiter bands
    if(p.name==='Jupiter'){
      for(let b=-1;b<=1;b++){
        ctx.save(); ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.clip();
        ctx.fillStyle='rgba(180,93,9,0.3)';
        ctx.fillRect(px-pr, py+b*pr*0.5-pr*0.12, pr*2, pr*0.25);
        ctx.restore();
      }
    }

    // Earth green patch hint
    if(p.name==='Earth'){
      ctx.save(); ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.clip();
      ctx.fillStyle='rgba(22,101,52,0.45)';
      ctx.fillRect(px-pr*0.25, py-pr*0.6, pr*0.5, pr*1.2);
      ctx.restore();
    }

    // selection ring
    if(i===state.selectedIndex){
      ctx.beginPath(); ctx.arc(px,py,pr+5,0,Math.PI*2);
      ctx.strokeStyle='#60a5fa'; ctx.lineWidth=1.5; ctx.stroke();
    }

    // labels
    if(state.showLabels && (pr>3 || state.zoom>0.5)){
      ctx.fillStyle = i===state.selectedIndex ? '#60a5fa' : '#94a3b8';
      ctx.font=`${Math.max(10,Math.min(13,pr+6))}px Segoe UI,sans-serif`;
      ctx.textAlign='center';
      ctx.fillText(p.name, px, py - pr - 6);
    }
  });
}

function lighten(hex, amt){
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.min(255,((n>>16)&0xff)+amt);
  const g=Math.min(255,((n>>8)&0xff)+amt);
  const b=Math.min(255,(n&0xff)+amt);
  return `rgb(${r},${g},${b})`;
}

// ─────────────────────────────────────────────
//  SIMULATION LOOP
// ─────────────────────────────────────────────
function tick(ts){
  if(state.lastTime===null) state.lastTime=ts;
  const dt=(ts-state.lastTime)/1000; // real seconds
  state.lastTime=ts;

  if(state.running){
    const simDt = dt * state.DAYS_PER_SEC * state.speed * state.direction;
    state.simDays += simDt;

    PLANETS.forEach((p,i)=>{
      if(i===0 || p.period===0) return;
      state.angles[i] += (2*Math.PI/p.period)*simDt;
    });

    updateDateDisplay();
  }

  draw();
  requestAnimationFrame(tick);
}

function updateDateDisplay(){
  const d=new Date(state.startDate.getTime() + state.simDays*86400000);
  const fmt=d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
  document.getElementById('sim-date-text').textContent=fmt;
  document.getElementById('date-input').value=d.toISOString().split('T')[0];
}

// ─────────────────────────────────────────────
//  CONTROLS
// ─────────────────────────────────────────────
document.getElementById('btn-playpause').addEventListener('click',()=>{
  state.running=!state.running;
  const btn=document.getElementById('btn-playpause');
  const badge=document.getElementById('status-badge');
  btn.textContent = state.running ? '⏸ Pause' : '▶ Play';
  badge.textContent = state.running ? '● RUNNING' : '● PAUSED';
  badge.className = 'status-badge ' + (state.running?'running':'paused');
});

document.getElementById('btn-reset').addEventListener('click',()=>{
  state.simDays=0;
  state.startDate=new Date('2024-01-01');
  state.angles=PLANETS.map(()=>Math.random()*Math.PI*2);
  state.panX=0; state.panY=0;
  state.speed=1; state.zoom=1;
  document.getElementById('zoom-slider').value=1;
  setSpeedActive(1);
  updateDateDisplay();
});

document.querySelectorAll('.speed-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const s=parseFloat(btn.dataset.speed);
    state.speed=s;
    setSpeedActive(s);
  });
});
function setSpeedActive(s){
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',parseFloat(b.dataset.speed)===s));
  document.getElementById('speed-badge').textContent=s+'×';
}

document.getElementById('tog-orbits').addEventListener('change',e=>{state.showOrbits=e.target.checked;});
document.getElementById('tog-labels').addEventListener('change',e=>{state.showLabels=e.target.checked;});
document.getElementById('tog-grid').addEventListener('change',e=>{state.showGrid=e.target.checked;});
document.getElementById('time-direction').addEventListener('change',e=>{state.direction=parseInt(e.target.value);});

function setScale(mode){
  state.scaleMode=mode;
  document.getElementById('btn-edu').classList.toggle('active',mode==='edu');
  document.getElementById('btn-real').classList.toggle('active',mode==='real');
}
window.setScale=setScale;

function zoom(delta){
  state.zoom=Math.max(0.1,Math.min(5,state.zoom+delta));
  document.getElementById('zoom-slider').value=state.zoom;
}
window.zoom=zoom;

function setZoom(v){state.zoom=v;}
window.setZoom=setZoom;

// Timeline
function applyDate(){
  const val=document.getElementById('date-input').value;
  if(!val) return;
  const d=new Date(val);
  state.startDate=d;
  state.simDays=0;
  updateDateDisplay();
}
window.applyDate=applyDate;

function jumpTime(days){
  if(days===0){
    state.startDate=new Date();
    state.simDays=0;
  } else {
    state.simDays+=days;
  }
  updateDateDisplay();
}
window.jumpTime=jumpTime;

function focusSelected(){
  if(state.selectedIndex < 0) return;
  const i = state.selectedIndex;
  if(i === 0){
    state.panX = 0;
    state.panY = 0;
  } else {
    const p = PLANETS[i];
    const r = orbitRadius(p, i);
    const angle = state.angles[i];
    state.panX = -r * Math.cos(angle);
    state.panY = -r * Math.sin(angle);
  }
}
window.focusSelected=focusSelected;

// ─────────────────────────────────────────────
//  PAN + ZOOM (mouse)
// ─────────────────────────────────────────────
let dragging=false, dragStart={x:0,y:0}, panStart={x:0,y:0};
canvas.addEventListener('mousedown',e=>{
  dragging=true;
  dragStart={x:e.clientX,y:e.clientY};
  panStart={x:state.panX,y:state.panY};
  area.classList.add('grabbing');
});
canvas.addEventListener('mousemove',e=>{
  if(dragging){
    state.panX=panStart.x+(e.clientX-dragStart.x);
    state.panY=panStart.y+(e.clientY-dragStart.y);
  }
  // tooltip / hover
  const pt=canvasPt(e);
  let found=false;
  for(let i=PLANETS.length-1;i>=0;i--){
    const {px,py,pr}=planetPos(i);
    if(Math.hypot(pt.x-px,pt.y-py)<pr+6){
      showTooltip(e.clientX,e.clientY,PLANETS[i].name);
      found=true; break;
    }
  }
  if(!found) hideTooltip();
});
canvas.addEventListener('mouseup',()=>{dragging=false;area.classList.remove('grabbing');});
canvas.addEventListener('mouseleave',()=>{dragging=false;area.classList.remove('grabbing');hideTooltip();});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  zoom(e.deltaY>0?-0.1:0.1);
  document.getElementById('zoom-slider').value=state.zoom;
},{passive:false});

canvas.addEventListener('click',e=>{
  if(Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>4) return; // was a drag
  const pt=canvasPt(e);
  for(let i=PLANETS.length-1;i>=0;i--){
    const {px,py,pr}=planetPos(i);
    if(Math.hypot(pt.x-px,pt.y-py)<pr+8){
      selectPlanet(i); return;
    }
  }
});

function canvasPt(e){
  const rect=canvas.getBoundingClientRect();
  return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}

function planetPos(i){
  const p=PLANETS[i];
  const r=orbitRadius(p,i);
  const angle=state.angles[i];
  const px=i===0?cx():cx()+r*Math.cos(angle);
  const py=i===0?cy():cy()+r*Math.sin(angle);
  const pr=planetRadius(p,i);
  return {px,py,pr};
}

const tooltip=document.getElementById('tooltip');
function showTooltip(x,y,name){
  tooltip.textContent=name;
  tooltip.style.display='block';
  tooltip.style.left=(x+12)+'px';
  tooltip.style.top=(y-24)+'px';
}
function hideTooltip(){tooltip.style.display='none';}

// ─────────────────────────────────────────────
//  PLANET SELECTION / INFO PANEL
// ─────────────────────────────────────────────
function selectPlanet(i){
  state.selectedIndex=i;
  document.querySelectorAll('.planet-item').forEach((el,j)=>el.classList.toggle('selected',j===i));
  renderInfoPanel(PLANETS[i]);
}

function renderInfoPanel(p){
  document.getElementById('info-name').textContent=p.name;
  const typeBadge=document.getElementById('info-type');
  typeBadge.style.display='block';
  typeBadge.textContent=p.type;

  const stats=[
    {label:'Diameter',value:p.diameter},
    {label:'Mass',value:p.mass},
    {label:'Dist. from Sun',value:p.distSun},
    {label:'Orbital Period',value:p.orbitalPeriod},
    {label:'Rotation',value:p.rotPeriodStr},
    {label:'Moons',value:String(p.moons)},
    {label:'Avg Temp',value:p.temp},
  ];
  const grid=document.getElementById('info-grid');
  grid.innerHTML=stats.map(s=>`<div class="info-cell"><div class="label">${s.label}</div><div class="value">${s.value}</div></div>`).join('');

  document.getElementById('info-atmo').innerHTML=`<strong style="color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;">Atmosphere</strong><br>${p.atmo}`;

  const factsBox=document.getElementById('info-facts-box');
  if(p.facts&&p.facts.length){
    factsBox.innerHTML=`<h4>Interesting Facts</h4>`+p.facts.map(f=>`<div class="fact-item">${f}</div>`).join('');
  } else {
    factsBox.innerHTML='';
  }
}

// Select Earth by default
selectPlanet(3);

// ─────────────────────────────────────────────
//  START
// ─────────────────────────────────────────────
requestAnimationFrame(tick);
</script>
</body>
</html>
