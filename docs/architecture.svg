<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" style="background:#07090e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="mesh1" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh3" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#da7756" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Panel Fill -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da7756"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="1100" height="680" fill="#07090e"/>
  <rect width="1100" height="680" fill="url(#mesh1)"/>
  <rect width="1100" height="680" fill="url(#mesh2)"/>
  <rect width="1100" height="680" fill="url(#mesh3)"/>

  <!-- Title & Subtitle -->
  <text x="550" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.02em">AETHER CODE — SYSTEM ARCHITECTURE</text>
  <text x="550" y="70" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">Unified Multi-Engine Agent Architecture with Liquid Glass Observability</text>

  <!-- ================= TIER 1: CLIENT LAYER ================= -->
  <g transform="translate(40, 100)" filter="url(#glassShadow)">
    <rect width="300" height="530" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
    <path d="M 0 18 Q 0 0 18 0 L 282 0 Q 300 0 300 18 L 300 48 L 0 48 Z" fill="rgba(255,255,255,0.06)"/>
    <text x="20" y="32" fill="#ffffff" font-size="14" font-weight="700">🔮 Presentation Tier (Client)</text>
    <text x="20" y="44" fill="#38bdf8" font-size="10" font-weight="600">BROWSER / CHROME APP MODE</text>

    <!-- Client Sub-Modules -->
    <!-- Liquid Glass UI -->
    <rect x="20" y="65" width="260" height="70" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="88" fill="#ffffff" font-size="12" font-weight="700">Apple Liquid Glass Material</text>
    <text x="35" y="106" fill="#94a3b8" font-size="10">SVG optical refraction filter</text>
    <text x="35" y="122" fill="#94a3b8" font-size="10">4 Dynamic environments (Aurora/Sonoma)</text>

    <!-- Tri-Engine Switchboard -->
    <rect x="20" y="148" width="260" height="90" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="170" fill="#ffffff" font-size="12" font-weight="700">Tri-Engine Switchboard</text>
    <circle cx="42" cy="190" r="4" fill="#38bdf8"/><text x="52" y="194" fill="#cbd5e1" font-size="10">✦ Gemini (Google)</text>
    <circle cx="42" cy="208" r="4" fill="#da7756"/><text x="52" y="212" fill="#cbd5e1" font-size="10">✳ Claude (Anthropic)</text>
    <circle cx="42" cy="226" r="4" fill="#10a37f"/><text x="52" y="230" fill="#cbd5e1" font-size="10">⯀ ChatGPT (OpenAI)</text>

    <!-- Live Terminal Component -->
    <rect x="20" y="250" width="260" height="95" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="34" cy="268" r="3.5" fill="#ef4444"/>
    <circle cx="44" cy="268" r="3.5" fill="#eab308"/>
    <circle cx="54" cy="268" r="3.5" fill="#22c55e"/>
    <text x="66" y="272" fill="#ffffff" font-size="11" font-weight="700">💻 Live Bash Terminal</text>
    <text x="35" y="295" fill="#38bdf8" font-size="10" font-family="monospace">● RUNNING</text>
    <text x="96" y="295" fill="#cbd5e1" font-size="10" font-family="monospace">user@aether:~$</text>
    <text x="35" y="313" fill="#34d399" font-size="10" font-family="monospace">✓ EXIT 0 (0.03s)</text>
    <text x="35" y="331" fill="#94a3b8" font-size="10">Real-time command stdout/stderr</text>

    <!-- SSE Receiver & State -->
    <rect x="20" y="358" width="260" height="70" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="380" fill="#ffffff" font-size="12" font-weight="700">SSE Event Stream Parser</text>
    <text x="35" y="398" fill="#94a3b8" font-size="10">Decodes delta, thought, tool, init</text>
    <text x="35" y="414" fill="#94a3b8" font-size="10">Markdown stream syntax highlighting</text>

    <!-- Session Sidebar -->
    <rect x="20" y="440" width="260" height="70" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="462" fill="#ffffff" font-size="12" font-weight="700">Prompt-Driven Session History</text>
    <text x="35" y="480" fill="#94a3b8" font-size="10">Direct user prompt title generation</text>
    <text x="35" y="496" fill="#94a3b8" font-size="10">Categorized: Today / Earlier / Prev</text>
  </g>

  <!-- ================= TIER 2: SERVER BACKEND ================= -->
  <g transform="translate(400, 100)" filter="url(#glassShadow)">
    <rect width="310" height="530" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
    <path d="M 0 18 Q 0 0 18 0 L 292 0 Q 310 0 310 18 L 310 48 L 0 48 Z" fill="rgba(255,255,255,0.06)"/>
    <text x="20" y="32" fill="#ffffff" font-size="14" font-weight="700">⚙️ Server Tier (Node.js Core)</text>
    <text x="20" y="44" fill="#da7756" font-size="10" font-weight="600">ZERO-DEPENDENCY RUNTIME (PORT 4567)</text>

    <!-- HTTP & SSE Server -->
    <rect x="20" y="65" width="270" height="85" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="88" fill="#ffffff" font-size="12" font-weight="700">server.js (Native HTTP/SSE)</text>
    <text x="35" y="106" fill="#cbd5e1" font-size="10">POST /api/chat — Real-time SSE</text>
    <text x="35" y="122" fill="#cbd5e1" font-size="10">GET  /api/conversations — Session list</text>
    <text x="35" y="138" fill="#cbd5e1" font-size="10">GET  /api/models — Dynamic engine models</text>

    <!-- AGY Manager -->
    <rect x="20" y="162" width="270" height="110" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="185" fill="#ffffff" font-size="12" font-weight="700">lib/agy-manager.js</text>
    <text x="35" y="203" fill="#cbd5e1" font-size="10">Subprocess lifecycle & process pooling</text>
    <text x="35" y="219" fill="#cbd5e1" font-size="10">Stream JSON stdout parser</text>
    <text x="35" y="235" fill="#38bdf8" font-size="10">Background Log Watcher (80ms poll)</text>
    <text x="35" y="251" fill="#94a3b8" font-size="10">Pipes thinking tokens to SSE stream</text>

    <!-- DB Reader & Title Engine -->
    <rect x="20" y="284" width="270" height="100" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="307" fill="#ffffff" font-size="12" font-weight="700">lib/db-reader.js</text>
    <text x="35" y="325" fill="#cbd5e1" font-size="10">SQLite3 (conversation_summaries.db)</text>
    <text x="35" y="341" fill="#cbd5e1" font-size="10">Transcript Prompt Extractor</text>
    <text x="35" y="357" fill="#34d399" font-size="10">Replaces hashes with user prompts</text>
    <text x="35" y="373" fill="#94a3b8" font-size="10">Unified DB + Brain directory merger</text>

    <!-- Models Provider Hub -->
    <rect x="20" y="396" width="270" height="60" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="418" fill="#ffffff" font-size="12" font-weight="700">lib/models.js</text>
    <text x="35" y="436" fill="#cbd5e1" font-size="10">Multi-engine registry & provider mapping</text>

    <!-- Systemd / Launcher Integration -->
    <rect x="20" y="468" width="270" height="48" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="488" fill="#ffffff" font-size="11" font-weight="700">bin/aether-code & Systemd</text>
    <text x="35" y="504" fill="#94a3b8" font-size="10">Persistent daemon on user login</text>
  </g>

  <!-- ================= TIER 3: AGENT & FOUNDATION MODELS ================= -->
  <g transform="translate(760, 100)" filter="url(#glassShadow)">
    <rect width="300" height="530" rx="18" fill="url(#glassFill)" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
    <path d="M 0 18 Q 0 0 18 0 L 282 0 Q 300 0 300 18 L 300 48 L 0 48 Z" fill="rgba(255,255,255,0.06)"/>
    <text x="20" y="32" fill="#ffffff" font-size="14" font-weight="700">⚡ Engine & Foundation Tier</text>
    <text x="20" y="44" fill="#10a37f" font-size="10" font-weight="600">ANTIGRAVITY CLI + CLOUD LLMs</text>

    <!-- Antigravity Subprocess -->
    <rect x="20" y="65" width="260" height="100" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="88" fill="#ffffff" font-size="12" font-weight="700">Antigravity CLI (agy)</text>
    <text x="35" y="106" fill="#cbd5e1" font-size="10">--output-format stream-json</text>
    <text x="35" y="122" fill="#cbd5e1" font-size="10">--dangerously-skip-permissions</text>
    <text x="35" y="138" fill="#cbd5e1" font-size="10">Tool Sandboxing & Terminal Executor</text>
    <text x="35" y="154" fill="#94a3b8" font-size="10">Subprocess spawned per turn</text>

    <!-- Brain Storage -->
    <rect x="20" y="178" width="260" height="85" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="35" y="200" fill="#ffffff" font-size="12" font-weight="700">~/.gemini/antigravity-cli/</text>
    <text x="35" y="218" fill="#38bdf8" font-size="10">transcript_full.jsonl (Full Thoughts)</text>
    <text x="35" y="234" fill="#cbd5e1" font-size="10">transcript.jsonl (Compact Log)</text>
    <text x="35" y="250" fill="#cbd5e1" font-size="10">conversation_summaries.db</text>

    <!-- Foundation Model 1: Gemini -->
    <rect x="20" y="276" width="260" height="70" rx="12" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.35)"/>
    <text x="35" y="298" fill="#38bdf8" font-size="12" font-weight="700">Google Gemini Models</text>
    <text x="35" y="316" fill="#ffffff" font-size="10">gemini-3.8-flash-high</text>
    <text x="35" y="332" fill="#94a3b8" font-size="10">Ultra-fast multimodal reasoning</text>

    <!-- Foundation Model 2: Claude -->
    <rect x="20" y="358" width="260" height="70" rx="12" fill="rgba(218,119,86,0.1)" stroke="rgba(218,119,86,0.35)"/>
    <text x="35" y="380" fill="#da7756" font-size="12" font-weight="700">Anthropic Claude Models</text>
    <text x="35" y="398" fill="#ffffff" font-size="10">claude-sonnet-4-6</text>
    <text x="35" y="414" fill="#94a3b8" font-size="10">Deep coding & architectural synthesis</text>

    <!-- Foundation Model 3: ChatGPT -->
    <rect x="20" y="440" width="260" height="70" rx="12" fill="rgba(16,163,127,0.1)" stroke="rgba(16,163,127,0.35)"/>
    <text x="35" y="462" fill="#10a37f" font-size="12" font-weight="700">OpenAI ChatGPT Models</text>
    <text x="35" y="480" fill="#ffffff" font-size="10">gpt-oss-120b-medium</text>
    <text x="35" y="496" fill="#94a3b8" font-size="10">Fast task orchestration & workflows</text>
  </g>

  <!-- Flow Arrows (Connecting Connectors) -->
  <!-- Client to Server -->
  <path d="M 340 300 L 400 300" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="398,296 408,300 398,304" fill="#38bdf8"/>
  <text x="370" y="290" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">SSE / HTTP</text>

  <!-- Server to Agent -->
  <path d="M 710 300 L 760 300" stroke="#da7756" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="758,296 768,300 758,304" fill="#da7756"/>
  <text x="735" y="290" text-anchor="middle" fill="#da7756" font-size="9" font-weight="600">SPAWN</text>
</svg>
