<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aether Code</title>
<link rel="stylesheet" href="base.css?v=1791270230">
<link rel="stylesheet" href="ide.css?v=1791300000">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
</head>
<body>
<div class="ambient"><i></i><i></i><i></i><i></i></div>
<div id="ide">
  <header id="topbar">
    <div class="tb-left">
      <button class="btn sm ghost icon" id="tg-side" title="Toggle sidebar (⌘B)"></button>
      <select id="ws-target" class="field sm" title="Where the workspace lives"></select>
      <button class="btn sm" id="ws-folder" title="Open folder…"></button>
    </div>
    <button id="cmdcenter" title="Go to file (⌘P)"><span class="ico" data-i="search"></span><span id="cmdtext">Search files</span><kbd>⌘P</kbd></button>
    <div class="tb-right">
      <button class="btn sm ghost icon" id="tg-panel" title="Toggle terminal (⌘J)"></button>
      <button class="btn sm ghost icon" id="tg-chat" title="Toggle AI team (⌘⌥C)"></button>
    </div>
  </header>

  <div id="mainrow">
    <nav id="activity">
      <div class="act-top">
        <button class="act on" data-view="explorer" title="Explorer (⇧⌘E)"></button>
        <button class="act" data-view="search" title="Search (⇧⌘F)"></button>
        <button class="act" data-view="git" title="Source control (⌃⇧G)"></button>
      </div>
      <div class="act-bot">
        <button class="act" id="act-eng" title="Engineers"></button>
        <button class="act" id="act-ssh" title="SSH connections"></button>
        <button class="act" id="act-mem" title="Shared memory"></button>
      </div>
    </nav>

    <aside id="sidebar" class="panel">
      <div id="view-explorer" class="view">
        <div class="vhead"><span id="ws-title">EXPLORER</span><span class="vact">
          <button data-a="newfile" title="New file"></button><button data-a="newdir" title="New folder"></button>
          <button data-a="refresh" title="Refresh"></button><button data-a="collapse" title="Collapse all"></button></span></div>
        <div id="tree" class="scroll"></div>
      </div>
      <div id="view-search" class="view" hidden>
        <div class="vhead"><span>SEARCH</span></div>
        <div class="sbox"><input id="q" class="field" placeholder="Search in workspace" autocomplete="off" spellcheck="false"><button id="q-case" class="btn sm icon" title="Match case">Aa</button></div>
        <div id="results" class="scroll"></div>
      </div>
      <div id="view-git" class="view" hidden>
        <div class="vhead"><span>SOURCE CONTROL</span><span class="vact"><button data-a="gitrefresh" title="Refresh"></button></span></div>
        <div id="gitlist" class="scroll"></div>
      </div>
      <section id="agents">
        <div class="vhead" id="agents-head" title="Click to collapse"><span><span class="chev">▾</span> AGENTS</span><span id="agents-sum" class="agents-sum"></span></div>
        <div id="agents-list" class="scroll"></div>
      </section>
    </aside>
    <div class="split v" id="sp-side"></div>

    <section id="center">
      <div id="editor-panel" class="panel strong">
        <div id="tabs"></div>
        <div id="crumbs"></div>
        <div id="banner" hidden></div>
        <div id="ehost">
          <div id="monaco"></div>
          <div id="viewer" hidden></div>
          <div id="welcome">
            <div class="w-orb">✦</div><h1>Aether Code</h1><p class="sm">An editor, terminal and AI engineering team in one glass window.</p>
            <div class="w-actions"><button class="btn primary" id="w-open">Open folder…</button><button class="btn" id="w-file">Go to file  ⌘P</button></div>
            <div id="w-recent"></div>
            <div class="w-keys sm"><span><kbd>⌘P</kbd> go to file</span><span><kbd>⇧⌘P</kbd> commands</span><span><kbd>⌘S</kbd> save</span><span><kbd>⌘J</kbd> terminal</span><span><kbd>⌘B</kbd> sidebar</span><span><kbd>⌘⌥C</kbd> AI team</span></div>
          </div>
        </div>
      </div>
      <div class="split h" id="sp-panel"></div>
      <div id="panel" class="panel strong">
        <div id="ptabs"><div id="pt-list"></div>
          <span class="vact"><button id="pt-new" title="New terminal"></button><button id="pt-vm" title="New terminal on…"></button><button id="pt-kill" title="Kill terminal"></button><button id="pt-close" title="Hide panel"></button></span></div>
        <div id="termhost"></div>
      </div>
    </section>

    <div class="split v" id="sp-chat"></div>
    <aside id="chat" class="panel strong">
      <div id="chat-head">
        <button class="btn sm ghost icon" id="chat-menu" title="Sessions & engineers"></button>
        <span id="title">New session</span>
        <div class="segmented" id="teamseg" title="Team: big jobs are split between engineers; questions and small jobs go to one engineer. Solo: one engineer always."><button id="solo" onclick="setTeam(false)">Solo</button><button id="team" onclick="setTeam(true)">Team</button></div>
        <select id="mode" class="field sm" onchange="setSet()" title="What engineers may do">
          <option value="chat">Chat only</option><option value="plan">Plan (read)</option><option value="edit">Edit files</option><option value="auto">Auto (run commands)</option></select>
        <div class="segmented" id="apprseg" title="Auto: engineers' commands run without asking (only catastrophic ones like sudo or wiping the disk still ask). Ask: every command needs your OK."><button id="ap-on" onclick="setAppr('full')">⚡ Auto</button><button id="ap-off" onclick="setAppr('ask')">Ask</button></div>
        <select id="target" hidden></select><input id="cwd" hidden>
      </div>
      <div id="drawer" hidden>
        <button class="btn primary" onclick="newSession()">＋ New session</button>
        <div class="sec">Sessions</div><div id="sessions" class="list"></div>
        <div class="sec">Engineers <span class="stat" id="stat" onclick="refreshStatus()" title="Click to re-check"></span> <button class="btn sm icon ghost" onclick="editEngineer()" title="Add engineer">＋</button></div>
        <div id="engs" class="list"></div>
      </div>
      <div id="msgs"></div>
      <div id="progress"></div>
      <button id="jump" class="btn sm primary" hidden onclick="jumpLatest()">↓ Latest activity</button>
      <div id="chips"></div>
      <div id="ctxbar"><label><input type="checkbox" id="ctx-on" checked> Include active file &amp; selection</label><span id="ctx-name" class="sm"></span></div>
      <div id="comp">
        <div id="hint" class="glass"></div>
        <textarea id="in" rows="1" placeholder="Ask the team…  @name · !cmd runs a shell command · /remember …"></textarea>
        <button id="go" class="btn primary" onclick="send()">Send</button>
      </div>
    </aside>
  </div>

  <footer id="status">
    <div class="st-left"><button id="st-remote" title="Switch workspace host"></button><button id="st-branch" hidden></button><span id="st-msg"></span></div>
    <div class="st-right"><span id="st-pos"></span><span id="st-lang"></span><span id="st-eol"></span><button id="st-eng" title="Engineers online"></button></div>
  </footer>
</div>
<div id="ctxmenu" hidden></div>
<div id="toast" hidden></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div id="card" class="glass"></div></div>

<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script src="vendor/monaco-env.js"></script>
<script src="vendor/monaco/vs/loader.js"></script>
<script src="ctxmenu.js"></script>
<script src="chat.js"></script>
<script src="ide.js"></script>
<script src="agents.js"></script>
</body></html>
